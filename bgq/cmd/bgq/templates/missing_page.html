<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{.Title}}</title>
<style>{{.CSS}}</style>
</head>
<body>
{{template "config_bar"}}
{{template "nav_paged" .}}
{{if .PageInfo}}<p>{{.PageInfo}}</p>{{end}}

<h2 class="section-title">{{.PageKind}}中缺失的人物</h2>
{{range .Persons}}<details class="person" data-idx="{{.Idx}}">
  <summary><span class="name">{{.Name}}</span> <span class="count">({{.Count}})</span>
    <a class="btn btn-create" href="#create-{{.Idx}}" data-idx="{{.Idx}}" data-name="{{.Name}}">创建</a>
  </summary>
</details>
{{else}}<p>暂无</p>{{end}}

<script>{{.JS}}</script>
<script>const _pendingData = {{.PendingData}}; let _bgmMpPending = null; let _bgmMpRelateData = null;</script>
<script>const _posNames = { {{.PosTable}} }; const _typeNames = {1:'书籍',2:'动画',3:'音乐',4:'游戏',6:'三次元'};</script>
<script>
(() => {
  const srcs = [
    'https://cdn.jsdmirror.com/npm/opencc-js@1.0.5/dist/umd/full.js',
    'https://cdn.jsdmirror.com/npm/opencc-cn-name@0.1.1/dist/umd/opencc-cn-name.js',
  ];
  let remaining = srcs.length;
  srcs.forEach((src) => {
    const s = document.createElement('script');
    s.src = src;
    s.onload = s.onerror = () => { if (--remaining === 0) window._openccReady = true; };
    document.head.appendChild(s);
  });
})();
</script>
<script>
(() => {
  const hl = new URLSearchParams(location.search).get('hl');
  if (!hl) return;
  const spans = document.querySelectorAll('details.person .name');
  for (let i = 0; i < spans.length; i++) {
    if (spans[i].textContent === hl) {
      const det = spans[i].closest('details.person');
      if (!det.open) {
        det.open = true;
        if (!det.querySelector('ul') && typeof renderSubjects === 'function') {
          renderSubjects(parseInt(det.dataset.idx, 10), det);
        }
      }
      det.classList.add('hl-target');
      det.scrollIntoView({ block: 'center' });
      setTimeout(() => det.classList.add('hl-target-done'), 3000);
      break;
    }
  }
})();
</script>
</body>
</html>
