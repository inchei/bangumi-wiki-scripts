<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{.Title}}</title>
<style>{{.CSS}}</style>
</head>
<body>
<div class="nav">
  <a href="index.html">&#x2190; 返回首页</a>
{{if .PrevLink}}  <a href="{{.PrevLink}}">&#x2190; 上一页</a>{{end}}
{{if .NextLink}}  <a href="{{.NextLink}}">下一页 &#x2192;</a>{{end}}
</div>
{{if .PageInfo}}<p>{{.PageInfo}}</p>{{end}}

<h2 class="section-title">{{.PageKind}}中缺失的人物</h2>
{{range .Persons}}<details class="person" data-idx="{{.Idx}}">
  <summary><span class="name">{{.Name}}</span> <span class="count">({{.Count}})</span>
    <a class="btn-create" href="#create-{{.Idx}}" data-idx="{{.Idx}}" data-name="{{.Name}}">创建</a>
  </summary>
</details>
{{else}}<p>暂无</p>{{end}}

<script>{{.JS}}</script>
<script>var _pendingData = {{.PendingData}};var _bgmMpPending = null;</script>
<script>var _posNames = { {{.PosTable}} };var _typeNames = {1:'书籍',2:'动画',3:'音乐',4:'游戏',6:'三次元'};</script>
<script>
(function() {
  var srcs = [
    'https://cdn.jsdmirror.com/npm/opencc-js@1.0.5/dist/umd/full.js',
    'https://cdn.jsdmirror.com/npm/opencc-cn-name@0.1.1/dist/umd/opencc-cn-name.js'
  ];
  var remaining = srcs.length;
  srcs.forEach(function(src) {
    var s = document.createElement('script');
    s.src = src;
    s.onload = s.onerror = function() { if (--remaining === 0) _openccReady = true; };
    document.head.appendChild(s);
  });
})();
</script>
<script>
(function() {
  var hl = new URLSearchParams(location.search).get('hl');
  if (!hl) return;
  var spans = document.querySelectorAll('details.person .name');
  for (var i = 0; i < spans.length; i++) {
    if (spans[i].textContent === hl) {
      var det = spans[i].closest('details.person');
      det.classList.add('hl-target');
      det.scrollIntoView({ block: 'center' });
      setTimeout(function() { det.classList.add('hl-target-done'); }, 3000);
      break;
    }
  }
})();
</script>
</body>
</html>
