{{define "config_bar"}}
<div id="mp-cfg" style="text-align:right;font-size:13px;"><span>API: <a id="mp-cfg-api" target="_blank"></a> <a href="javascript:void(0)" onclick="mpConfigureApi()">[配置]</a> | Bangumi: <a id="mp-cfg-bgm" target="_blank"></a> <a href="javascript:void(0)" onclick="mpConfigureBgm()">[配置]</a></span></div>
<script>
const MP_DEFAULT_API = 'https://api.bgm.tv';
const MP_DEFAULT_BGM = 'https://bgm.tv';

function mpGetApi() {
  try {
    const v = localStorage.getItem('mp_api');
    return v ? v.replace(/\/+$/, '') : MP_DEFAULT_API;
  } catch (e) {
    return MP_DEFAULT_API;
  }
}

function mpGetBgm() {
  try {
    const v = localStorage.getItem('mp_bgm');
    return v ? v.replace(/\/+$/, '') : MP_DEFAULT_BGM;
  } catch (e) {
    return MP_DEFAULT_BGM;
  }
}

function mpSetApi(v) {
  try {
    if (!v) localStorage.removeItem('mp_api');
    else localStorage.setItem('mp_api', v.replace(/\/+$/, ''));
  } catch (e) {}
}

function mpSetBgm(v) {
  try {
    if (!v) localStorage.removeItem('mp_bgm');
    else localStorage.setItem('mp_bgm', v.replace(/\/+$/, ''));
  } catch (e) {}
}

function mpRenderCfg() {
  const api = mpGetApi();
  const bgm = mpGetBgm();
  const apiEl = document.getElementById('mp-cfg-api');
  if (apiEl) {
    apiEl.textContent = api;
    apiEl.href = api;
  }
  const bgmEl = document.getElementById('mp-cfg-bgm');
  if (bgmEl) {
    bgmEl.textContent = bgm;
    bgmEl.href = bgm;
  }
  const appLink = document.getElementById('mp-bgm-app-link');
  if (appLink) appLink.href = bgm + '/dev/app/6476';
}

function mpConfigureApi() {
  const cur = mpGetApi();
  let v = prompt('API 地址', cur);
  if (v === null) return;
  v = v.trim();
  mpSetApi(v);
  mpRenderCfg();
  location.reload();
}

function mpConfigureBgm() {
  const cur = mpGetBgm();
  let v = prompt('Bangumi 地址', cur);
  if (v === null) return;
  v = v.trim();
  mpSetBgm(v);
  mpRenderCfg();
  location.reload();
}

document.addEventListener('DOMContentLoaded', mpRenderCfg);
</script>
{{end}}
