services:
  bgq:
    build:
      context: ..
      dockerfile: bgq/Dockerfile
    env_file: .env
    ports:
      - "${PORT:-7860}:${PORT:-7860}"
    volumes:
      - bgq-data:/data
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:uid=1000,gid=1000,mode=1777
      - /home/bgq:uid=1000,gid=1000,exec
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

volumes:
  bgq-data:
