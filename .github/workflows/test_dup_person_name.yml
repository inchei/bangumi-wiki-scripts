name: find duplicate person names

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.10'

      - name: 安装 uv
        uses: astral-sh/setup-uv@v10
        with:
          cache-dependency-glob: '**/*.py'

      - name: 下载 Bangumi 归档
        run: bash bgq/download-archive.sh bangumi_archive

      - name: 同步同名人物到目录 100490
        env:
          BANGUMI_TOKEN: ${{ secrets.BANGUMI_TOKEN }}
        run: python3 find_dup_person_name.py | uv run sync_index.py --index 100490
