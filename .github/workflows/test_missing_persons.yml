name: update missing persons

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

env:
  DUCKDB_VERSION: "1.2.0"

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 拉取代码
        uses: actions/checkout@v7

      - name: 设置 Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.10'

      - name: 安装 uv
        uses: astral-sh/setup-uv@v10
        with:
          cache-dependency-glob: '**/*.py'

      - name: 设置 Go
        uses: actions/setup-go@v7
        with:
          go-version-file: bgq/go.mod
          cache-dependency-path: bgq/go.sum

      - name: 下载 DuckDB
        run: |
          curl -fsSL "https://github.com/duckdb/duckdb/releases/download/v${DUCKDB_VERSION}/duckdb_cli-linux-amd64.zip" -o /tmp/duckdb.zip
          python3 -c "import zipfile; zipfile.ZipFile('/tmp/duckdb.zip').extractall('bgq/bin/')"
          chmod +x bgq/bin/duckdb

      - name: 构建 bgq
        run: |
          cd bgq
          mkdir -p internal/server/dist
          touch internal/server/dist/.keep
          go build -o bin/bgq ./cmd/bgq/

      - name: 下载 Bangumi 归档
        run: bash bgq/download-archive.sh bangumi_archive

      - name: 构建 DuckDB 数据库
        run: bgq/bin/bgq ingest --data-dir bangumi_archive --db bgq/bangumi.db

      - name: 生成别名 JSON
        run: uv run person_alias.py

      - name: 运行缺失人物检测
        env:
          DUCKDB_PATH: ${{ github.workspace }}/bgq/bin/duckdb
        run: |
          bgq/bin/bgq missing persons --db bgq/bangumi.db --archive-dir bangumi_archive --aliases-file person_alias.json
          mkdir -p _site
          cp -r docs/missing-persons _site/missing-persons

      - name: 合并现有站点
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          site_url="$(gh api repos/$GITHUB_REPOSITORY/pages --jq '.html_url // empty' 2>/dev/null || true)"
          if [ -z "$site_url" ]; then
            site_url="https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}/"
          fi
          if [ -n "$site_url" ]; then
            echo "现有站点: $site_url，下载并保留其他页面"
            wget -q -m -np -nH --cut-dirs=1 -X missing-persons -e robots=off -P _site "$site_url" || true
          else
            echo "未获取到 Pages URL，跳过合并"
          fi

      - name: 配置 GitHub Pages
        uses: actions/configure-pages@v6

      - name: 上传 Pages 构建产物
        uses: actions/upload-pages-artifact@v5
        with:
          path: '_site'

      - name: 部署到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
